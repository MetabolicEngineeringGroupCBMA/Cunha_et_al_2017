name: Test Jupyter Notebooks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: "ignore:Feature qualifier key 'ApEinfo_graphicformat' is longer than maximum length specified by standard"

jobs:
  test-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nbval pydna

      - name: Run Jupyter notebook tests
        working-directory: notebooks
        run: |
          shopt -s globstar
          pytest -vvv --import-mode=importlib --current-env --capture=no --nbval **/*.ipynb
